name: Compile Linux ARM64 Targets

on:
  push:
    branches:
    - 'main'
    - 'stable'
    - 'beta'
    - 'create-artifacts'
  pull_request:
    branches:
    - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        docker: [
          #"px4io/px4-dev-aarch64:2022-08-12",
          #"px4io/px4-dev-armhf:2023-06-26",
          "px4io/px4-dev-nuttx-focal:2022-08-12",
        ]
    container: ${{matrix.docker}}
    steps:
    - uses: actions/checkout@v4
      with:
        submodule: recursive

    # action step to create as output the binary architecture type based on docker name using ifs
    - name: Get architecture
      id: get_arch
      run: |
        if [[ ${{matrix.docker}} == *"aarch64"* ]]; then
          echo "::set-output name=arch::arm64"
        elif [[ ${{matrix.docker}} == *"armhf"* ]]; then
          echo "::set-output name=arch::armhf"
        else
          echo "::set-output name=arch::amd64"
        fi

    - name: Prepare ccache timestamp
      id: ccache_cache_timestamp
      shell: cmake -P {0}
      run: |
        string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
        message("::set-output name=timestamp::${current_date}")
    - name: ccache cache files
      uses: actions/cache@v2
      with:
        path: ~/.ccache
        key: ${{matrix.docker}}-ccache-${{steps.ccache_cache_timestamp.outputs.timestamp}}
        restore-keys: ${{matrix.docker}}-ccache-
    - name: setup ccache
      run: |
          mkdir -p ~/.ccache
          echo "base_dir = ${GITHUB_WORKSPACE}" > ~/.ccache/ccache.conf
          echo "compression = true" >> ~/.ccache/ccache.conf
          echo "compression_level = 6" >> ~/.ccache/ccache.conf
          echo "max_size = 100M" >> ~/.ccache/ccache.conf
          echo "hash_dir = false" >> ~/.ccache/ccache.conf
          ccache -s
          ccache -z

    - name: Configure git for docker
      run: git config --global --add safe.directory /__w/Firmware/Firmware
    - name: make px4_sitl
      run: make px4_sitl
    - name: create artifact
      run: zip px4-${{steps.get_arch.outputs.arch}}.zip -r build/px4_sitl_default/bin -r
    - name: ccache post-run
      run: ccache -s

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      timeout-minutes: 120
      with:
        name: px4-${{steps.get_arch.outputs.arch}}.zip
        path: px4-${{steps.get_arch.outputs.arch}}.zip
        if-no-files-found: error
        retention-days: 7

    - name: Upload artifact for release
      uses: svenstaro/upload-release-action@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: px4-${{steps.get_arch.outputs.arch}}.zip
        tag: ${{ github.ref }}
        overwrite: true
        prerelease: true
